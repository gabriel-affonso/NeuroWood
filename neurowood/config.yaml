app:
  name: NeuroWood
  version: 2.0.0
  mode: simulation

camera:
  type: simulated
  image_dir: data/simulation
  pixel_format: Mono8
  timeout_ms: 500

conveyor:
  nominal_speed_mm_s: 600
  speed_factor: 1.0

capture:
  frame_spacing_mm: 250
  max_frames: 16

vision:
  overlap: 0.25
  sensitivity: 0.65
  min_defect_area_px: 40

plc:
  type: simulated
  ip: 10.10.0.30
  rack: 0
  slot: 1

storage:
  database: data/neurowood.db
  image_dir: data/images

logging:
  level: INFO
  file: logs/neurowood.log
